[package]
name = "t2fanrd"
version = "0.4.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Simple Fan Daemon for T2 Macs"
repository = "https://github.com/GnomedDev/T2FanRD"

[features]
default = []
skip_linux_check = []
skip_root_check = []
skip_flock = []
observability = ["dep:sentry", "dep:sentry-log"]

[dependencies]
glob = { version = "0.3.1", default-features = false }
libc = { version = "0.2.149", default-features = false }
nonempty = { version = "0.12.0", default-features = false }
rust-ini = { version = "0.21.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
signal-hook = { version = "0.4.4", default-features = false }
arraydeque = "0.5.1"
log = "0.4.32"
env_logger = { version = "0.11.10", default-features = false, features = ["humantime"] }
clap = { version = "4.6.1", default-features = false, features = ["derive", "help", "std", "usage"] }
sentry = { version = "0.48.2", optional = true, default-features = false, features = ["log", "panic", "transport", "logs"] }
sentry-log = { version = "0.48.2", optional = true }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
codegen-units = 1
