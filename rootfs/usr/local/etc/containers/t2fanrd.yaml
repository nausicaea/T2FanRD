name: t2fanrd
container:
  entrypoint: ./t2fanrd
  args:
    - "-c"
    - "./config.ini"
  security:
    writeableSysfs: true
  mounts:
    - source: /sys
      destination: /sys
      type: bind
      options:
        - bind
        - rw
depends:
  - path: /sys/class/hwmon
  - network:
      - addresses
      - connectivity
restart: always
logToConsole: true
