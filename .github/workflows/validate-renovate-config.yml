name: Validate Renovate Config
on:
  pull_request:
    paths:
      - 'renovate.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --package renovate -- renovate-config-validator
